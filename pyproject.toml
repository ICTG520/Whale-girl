[project]
name = "whale-girl"
version = "0.1.0"
description = "NapCat + OneBot v11 + NoneBot2 QQ bot"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "nonebot2[fastapi]>=2.5.0,<3.0.0",
  "nonebot-adapter-onebot>=2.4.0,<3.0.0",
  "openai>=1.60.0,<3.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.nonebot]
plugin_dirs = ["plugins"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
